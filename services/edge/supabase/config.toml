project_id = "catpaw-local"

[functions.catpaw-api]
# v14 validates the bearer/session, scope, consent and revocation inside the API.
# Preserve that authority path; this gateway setting does not grant access.
verify_jwt = false

[functions.catpaw-proactive]
# User routes verify the Supabase JWT (incl. anonymous) inside the function; /scheduler/tick uses CATPAW_SCHEDULER_SECRET.
verify_jwt = false

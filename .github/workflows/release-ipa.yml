name: release-ipa
# Ad-hoc / development signed ipa → GitHub Release. No TestFlight. Never runs on pull requests.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      export_method:
        description: 'release-testing (ad-hoc) or debugging (development)'
        default: release-testing
        type: choice
        options: [release-testing, debugging]
permissions:
  contents: write
concurrency: { group: release-ipa-${{ github.ref }}, cancel-in-progress: false }
jobs:
  ipa:
    runs-on: macos-26
    env:
      APP_DIR: apps/ios-conversation
      SCHEME: DeviceTrial
      CONFIGURATION: DeviceTrial
      EXPORT_METHOD: ${{ inputs.export_method || 'release-testing' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - name: Versions (marketing from Version.xcconfig, build = run_number, CatpawGitSHA = git SHA)
        id: ver
        run: |
          MV=$(sed -n 's/^MARKETING_VERSION *= *//p' $APP_DIR/Configuration/Version.xcconfig | tr -d ' ')
          echo "marketing=$MV" >> "$GITHUB_OUTPUT"; echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CatpawGitSHA $(git rev-parse --short HEAD)" $APP_DIR/Configuration/DeviceTrial.Info.plist
      - name: Public app config (optional, non-secret Local.xcconfig)
        env: { LOCAL_XCCONFIG_B64: '${{ secrets.CATPAW_LOCAL_XCCONFIG_BASE64 }}' }
        run: if [ -n "$LOCAL_XCCONFIG_B64" ]; then echo "$LOCAL_XCCONFIG_B64" | base64 --decode > $APP_DIR/Configuration/Local.xcconfig; fi
      - name: Temporary keychain + certificate + provisioning profiles
        env:
          P12_B64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          WIDGET_PROFILE_B64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/catpaw-signing.keychain-db"; KC_PW=$(openssl rand -hex 24)
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PW" "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$PROF_DIR"
          for v in APP WIDGET; do
            eval B64=\$${v}_PROFILE_B64; F="$RUNNER_TEMP/$v.mobileprovision"; echo "$B64" | base64 --decode > "$F"
            security cms -D -i "$F" > "$RUNNER_TEMP/$v.plist"
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$v.plist"); NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$v.plist")
            BID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/$v.plist" | cut -d. -f2-)
            TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/$v.plist")
            cp "$F" "$PROF_DIR/$UUID.mobileprovision"
            echo "${v}_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"; echo "${v}_BUNDLE_ID=$BID" >> "$GITHUB_ENV"; echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          done
          echo "SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(.*\)"/\1/p' | head -1)" >> "$GITHUB_ENV"
      - name: Archive (manual signing, bundle ids from the profiles)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project CatpawM.xcodeproj -scheme "$SCHEME" -configuration "$CONFIGURATION" -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Catpaw.xcarchive" archive \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} MARKETING_VERSION=${{ steps.ver.outputs.marketing }} \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGN_IDENTITY" OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            -allowProvisioningUpdates=NO | tail -30
          # Per-target bundle id / profile are set via the export plist below; the archive step uses the project's ids.
      - name: Export ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>provisioningProfiles</key><dict>
              <key>$APP_BUNDLE_ID</key><string>$APP_PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Catpaw.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1); OUT="$RUNNER_TEMP/Catpaw-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.ipa"; mv "$IPA" "$OUT"
          echo "IPA=$OUT" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v${{ steps.ver.outputs.marketing }}-build${{ steps.ver.outputs.build }}"
          gh release create "$TAG" "$IPA" --target "${{ github.sha }}" --prerelease \
            --title "Catpaw ${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }})" \
            --notes "Ad-hoc/development ipa · CatpawGitSHA ${{ steps.ver.outputs.sha }} · installs only on devices in the provisioning profile."
      - name: Delete temporary keychain and profiles
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.plist
